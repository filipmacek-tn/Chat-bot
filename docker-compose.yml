services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  api:
    build: apps/api
    env_file:
      - .env
    depends_on:
      - postgres
      - qdrant
      - ollama
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/data/uploads

  admin:
    build: apps/admin
    depends_on:
      - api
    ports:
      - "5173:5173"

  widget:
    build: apps/widget
    ports:
      - "5174:5174"

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
