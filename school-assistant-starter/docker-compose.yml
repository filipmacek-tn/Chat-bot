name: school-assistant-starter
services:
  redis:
    image: redis:7
    platform: linux/arm64/v8
    ports:
      - "6379:6379"

  duckling:
    image: rasa/duckling
    platform: linux/amd64           # M1 emulacja x86
    command: ["duckling-example-exe", "--no-index", "-p", "8000"]
    restart: unless-stopped
    
  rasa:
    image: rasa/rasa:3.6.2
    platform: linux/arm64/v8
    working_dir: /app
    volumes:
      - /Users/hikaru/Desktop/school-assistant-starter/rasa-bot:/app
    command: >
      run --enable-api --cors '*' --port 5005 --debug
    environment:
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    ports:
      - "5005:5005"
    depends_on:
      duckling:
        condition: service_started

  actions:
    image: rasa/rasa-sdk:3.6.2
    platform: linux/amd64        # <— tylko ten serwis w emulacji x86
    volumes:
      - /Users/hikaru/Desktop/school-assistant-starter/rasa-bot/actions:/app/actions
    entrypoint: ["python","-m","rasa_sdk"]
    command: ["--actions","actions"]
    ports:
      - "5055:5055"

  backend:
    build:
      context: /Users/hikaru/Desktop/school-assistant-starter/backend
      dockerfile: Dockerfile
    platform: linux/arm64/v8
    environment:
      REDIS_URL: redis://redis:6379/0
      RASA_URL: http://rasa:5005
      DUCKLING_URL: http://duckling:8000
      SESSION_TTL: "172800"
      FLASK_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      rasa:
        condition: service_started
      actions:
        condition: service_started

  frontend:
    build:
      context: /Users/hikaru/Desktop/school-assistant-starter/frontend
      dockerfile: Dockerfile
    platform: linux/arm64/v8
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

networks:
  default:
    name: school-assistant-starter_default