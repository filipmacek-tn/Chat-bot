name: school-assistant-starter
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  duckling:
    image: rasa/duckling
    # Jeśli masz bardzo mało RAM, możesz włączyć lżejszy start:
    # command: ["duckling-example-exe", "--no-index", "-p", "8000"]

  rasa:
    image: rasa/rasa:3.6.2
    working_dir: /app
    volumes:
      - ./rasa-bot:/app
    command: >
      run --enable-api --cors '*' --port 5005 --debug
    environment:
      # bezpieczne na każdej architekturze (omija natywne bindingi protobuf)
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    ports:
      - "5005:5005"
    depends_on:
      duckling:
        condition: service_started

  actions:
    image: rasa/rasa-sdk:3.6.2
    # nie zasłaniamy całego /app, tylko katalog z akcjami
    volumes:
      - ./rasa-bot/actions:/app/actions
    entrypoint: ["python","-m","rasa_sdk"]
    command: ["--actions","actions"]
    ports:
      - "5055:5055"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      RASA_URL: http://rasa:5005
      DUCKLING_URL: http://duckling:8000
      SESSION_TTL: "172800"
      FLASK_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      rasa:
        condition: service_started
      actions:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

networks:
  default:
    name: school-assistant-starter_default
